<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Support Agent</title>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:2rem auto;padding:0 1rem}
#log{border:1px solid #ccc;border-radius:8px;height:360px;overflow-y:auto;padding:.75rem;margin-bottom:.75rem}
.u{text-align:right;color:#0b5}.a{color:#333}.m{margin:.4rem 0}
form{display:flex;gap:.5rem}input{flex:1;padding:.6rem}button{padding:.6rem 1rem}
</style></head><body>
<h2>AI Support Agent</h2><div id="log"></div>
<form id="f"><input id="t" placeholder="Ask about an order or return..." autocomplete="off"><button>Send</button></form>
<script>
const sid="web-"+Math.random().toString(36).slice(2,8);
const log=document.getElementById("log");
function add(c,t){const d=document.createElement("div");d.className="m "+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();const i=document.getElementById("t"),m=i.value.trim();if(!m)return;
  add("u",m);i.value="";
  try{
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid,message:m})});
    const j=await r.json();add("a",r.ok?j.reply:"Error: "+j.detail);
  }catch(err){add("a","Network error")}
};
</script></body></html>
